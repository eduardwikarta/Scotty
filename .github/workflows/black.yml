name: black

on:
  push:
    paths:
      - '**.py'
  pull_request:
    paths:
      - '**.py'

defaults:
  run:
    shell: bash

jobs:
  black:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.x
    - name: Install black
      run: |
        python -m pip install --upgrade pip
        pip install black
    - name: Version
      run: |
        python --version
        black --version
    # Check only: run `black scotty tests` locally before pushing
    - name: Run black
      run: |
        black --check --diff scotty tests
